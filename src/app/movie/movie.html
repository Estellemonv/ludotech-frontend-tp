<div class="page">
	<mat-card class="items-card">
		<div class="toolbar">
			<mat-form-field appearance="outline" class="search-bar">
				<mat-label>Rechercher un film</mat-label>
				<label class="visually-hidden" for="movie-search-input">Rechercher un film</label>
				<input
					id="movie-search-input"
					matInput
					(keyup)="applyFilter($event)"
					placeholder="Titre, réalisateur ou genre">
				<mat-icon matSuffix>search</mat-icon>
			</mat-form-field>

			<button mat-flat-button color="primary" class="add-button" (click)="openForm()">
				<mat-icon>add</mat-icon>
				Ajouter un film
			</button>
		</div>

		<table mat-table [dataSource]="dataSource">
			<ng-container matColumnDef="name">
				<th mat-header-cell *matHeaderCellDef>Titre</th>
				<td mat-cell *matCellDef="let movie">{{ movie.name }}</td>
			</ng-container>

			<ng-container matColumnDef="duration">
				<th mat-header-cell *matHeaderCellDef>Durée</th>
				<td mat-cell *matCellDef="let movie">{{ movie.duration }}</td>
			</ng-container>

			<ng-container matColumnDef="realisateur">
				<th mat-header-cell *matHeaderCellDef>Réalisateur</th>
				<td mat-cell *matCellDef="let movie">{{ movie.realisateur }}</td>
			</ng-container>

			<ng-container matColumnDef="genre">
				<th mat-header-cell *matHeaderCellDef>Genre</th>
				<td mat-cell *matCellDef="let movie">{{ movie.genre }}</td>
			</ng-container>

			<ng-container matColumnDef="status">
				<th mat-header-cell *matHeaderCellDef>Statut</th>
				<td mat-cell *matCellDef="let movie">{{ movie.status }}</td>
			</ng-container>

			<ng-container matColumnDef="actions">
				<th mat-header-cell *matHeaderCellDef>Actions</th>
				<td mat-cell *matCellDef="let movie">
					<button mat-icon-button (click)="openForm(movie)" aria-label="Modifier">
						<mat-icon>edit</mat-icon>
					</button>
					<button mat-icon-button (click)="deleteMovie(movie)" aria-label="Supprimer">
						<mat-icon>delete</mat-icon>
					</button>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
			<tr class="mat-row" *matNoDataRow>
				<td class="mat-cell" colspan="6">Aucun film trouvé</td>
			</tr>
		</table>
	</mat-card>
</div>
