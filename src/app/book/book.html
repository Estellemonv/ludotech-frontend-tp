<div class="page">
	<mat-card class="items-card">
		<div class="toolbar">
			<mat-form-field appearance="outline" class="search-bar">
				<mat-label>Rechercher un livre</mat-label>
				<label class="visually-hidden" for="book-search">Rechercher un livre</label>
				<input
					id="book-search"
					matInput
					(keyup)="applyFilter($event)"
					placeholder="Titre, auteur ou genre">
				<mat-icon matSuffix>search</mat-icon>
			</mat-form-field>

			<button mat-flat-button color="primary" class="add-button" (click)="addBook()">
				<mat-icon>add</mat-icon>
				Ajouter un livre
			</button>
		</div>

		<table mat-table [dataSource]="dataSource">
			<ng-container matColumnDef="book_name">
				<th mat-header-cell *matHeaderCellDef>Titre</th>
				<td mat-cell *matCellDef="let book">{{ book.book_name }}</td>
			</ng-container>

			<ng-container matColumnDef="author">
				<th mat-header-cell *matHeaderCellDef>Auteur</th>
				<td mat-cell *matCellDef="let book">{{ book.author }}</td>
			</ng-container>

			<ng-container matColumnDef="year_of_parution">
				<th mat-header-cell *matHeaderCellDef>Année</th>
				<td mat-cell *matCellDef="let book">{{ book.year_of_parution }}</td>
			</ng-container>

			<ng-container matColumnDef="genre">
				<th mat-header-cell *matHeaderCellDef>Genre</th>
				<td mat-cell *matCellDef="let book">{{ book.genre }}</td>
			</ng-container>

			<ng-container matColumnDef="status">
				<th mat-header-cell *matHeaderCellDef>Statut</th>
				<td mat-cell *matCellDef="let book">{{ book.status }}</td>
			</ng-container>

			<ng-container matColumnDef="actions">
				<th mat-header-cell *matHeaderCellDef>Actions</th>
				<td mat-cell *matCellDef="let book">
					<button mat-icon-button (click)="editBook(book)" aria-label="Modifier">
						<mat-icon>edit</mat-icon>
					</button>
					<button mat-icon-button (click)="deleteBook(book)" aria-label="Supprimer">
						<mat-icon>delete</mat-icon>
					</button>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
			<tr class="mat-row" *matNoDataRow>
				<td class="mat-cell" colspan="6">Aucun livre trouvé</td>
			</tr>
		</table>
	</mat-card>
</div>
